# Automatically dump openapi.yaml & openapi.json to target/generated/openapi/ on every compile/test
quarkus.smallrye-openapi.store-schema-directory=target/generated/openapi
quarkus.smallrye-openapi.info-title=App Backend API
quarkus.smallrye-openapi.info-version=0.1.0

# Serve SPA index.html fallback for client-side routing if needed
quarkus.http.root-path=/
quarkus.rest.path=/api
